name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    name: Package and attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          node -e
          'const p=require("./package.json");if(`v${p.version}`!==process.env.RELEASE_TAG)process.exit(1)'
      - name: Build package
        id: package
        shell: bash
        run: |
          package_file="$(npm pack --silent)"
          sha256sum "$package_file" > "$package_file.sha256"
          echo "file=$package_file" >> "$GITHUB_OUTPUT"
      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "$PACKAGE_FILE"
          "$PACKAGE_FILE.sha256"
          --clobber
