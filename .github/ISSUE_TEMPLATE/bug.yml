name: Bug report
description: Report a reproducible defect without including private release data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not paste credentials, private endpoints, or production response bodies.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - scan
        - inspect
        - verify
        - GitHub Action
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic paths, hashes, and response values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
