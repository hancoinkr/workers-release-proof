name: Release proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Verify reviewed release state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hancoinkr/workers-release-proof@v0.2.0
        with:
          config: release-proof.config.json
